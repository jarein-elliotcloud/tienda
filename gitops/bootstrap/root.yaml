apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jarein-elliotcloud/tienda.git
    targetRevision: main
    path: gitops/bootstrap/apps        # aquí solo hay Applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd                  # las Applications se crean en argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
