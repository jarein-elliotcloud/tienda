apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tienda
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jarein-elliotcloud/tienda.git
    targetRevision: main
    path: gitops/apps/tienda
  destination:
    server: https://kubernetes.default.svc
    namespace: tienda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
