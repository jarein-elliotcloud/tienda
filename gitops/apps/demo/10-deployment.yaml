apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: whoami          # el Deployment gestiona los pods con esta etiqueta
  template:                # la "plantilla" de cada pod
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.1
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 10m, memory: 16Mi }   # lo que reserva el scheduler
            limits: { memory: 32Mi }               # si lo supera, Kubernetes lo mata
