apiVersion: apps/v1
kind: Deployment
metadata:
  name: back
spec:
  replicas: 2
  selector:
    matchLabels:
      app: back
  template:
    metadata:
      labels:
        app: back
    spec:
      securityContext:
        runAsNonRoot: true            # Kubernetes se niega a arrancarlo si la imagen usa root
        runAsUser: 10001
      containers:
        - name: back
          image: tienda-back:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DB_HOST
              value: postgres.postgres.svc.cluster.local
            - name: DB_NAME
              value: tienda
          envFrom:
            - secretRef:
                name: db-app          # aporta DB_USER y DB_PASSWORD
          readinessProbe:             # ¿le mando tráfico?
            httpGet: { path: /salud, port: http }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:              # ¿lo reinicio?
            httpGet: { path: /vivo, port: http }
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
