apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path-retain
  annotations:
    argocd.argoproj.io/sync-wave: "-1"   # créame ANTES que el resto (los demás son la ola 0)
provisioner: rancher.io/local-path       # el mismo que trae K3s
reclaimPolicy: Retain                    # si se borra el PVC, el disco NO se borra
volumeBindingMode: WaitForFirstConsumer  # no crees el disco hasta saber en qué nodo va el pod
