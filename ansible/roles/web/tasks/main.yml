- name: Instalar nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600   # no actualizar la lista de paquetes si se hizo hace < 1 h

- name: Escribir la página de inicio
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    mode: "0644"
  notify: Recargar nginx     # avisa al handler SOLO si el fichero cambió

- name: Arrancar nginx (los contenedores no tienen systemd)
  ansible.builtin.command: nginx
  args:
    creates: /run/nginx.pid  # si este fichero existe, nginx ya corre: no lo ejecuta
