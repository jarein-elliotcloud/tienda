- name: Preparar los nodos (Ansible necesita Python en el destino)
  hosts: web
  gather_facts: false        # aún no hay Python, así que no puede recoger facts
  tasks:
    - name: Instalar Python si falta
      ansible.builtin.raw: >
        test -e /usr/bin/python3 && echo YA ||
        (apt-get update -qq && apt-get install -y -qq python3 python3-apt && echo INSTALADO)
      register: py
      changed_when: "'INSTALADO' in py.stdout"

- name: Configurar los servidores web
  hosts: web
  roles:
    - web
